# ==========================================================================
# Configuración por defecto: usa MySQL directamente
# ==========================================================================
spring:
  application:
    name: kiert-backend

  profiles:
    active: mysql  # Activa MySQL por defecto

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 60MB

server:
  port: 8080
  error:
    include-message: always

# --------------------------------------------------------------------------
# Configuración propia de la app
# --------------------------------------------------------------------------
kiert:
  jwt:
    secret: "name"
    expiration-ms: 86400000
  cors:
    allowed-origins: "name"
  frontend:
    reset-password-url: "name"

  # ✅ CONFIGURACIÓN DE CLOUDINARY (NUEVO)
  cloudinary:
    cloud-name: "name"  # ← REEMPLAZA CON TU CLOUD NAME
    api-key: "name"   # ← REEMPLAZA CON TU API KEY
    api-secret: "name"  # ← REEMPLAZA CON TU API SECRET

  # ⚠️ SUPABASE (Ya no se usa para imágenes, pero mantenemos por si acaso)
  supabase:
    url: "name"
    bucket: "kiert-files"
    service-role-key: "name"

---
# ============================================================
# PERFIL: mysql (Base de datos MySQL)
# ============================================================
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: jdbc:mysql://localhost:3306/kiert_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: contraseña
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  mail:
    host: smtp.gmail.com
    port: 587
    username: name
    password: name
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
      show-sql: true
      format-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: never

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
      com.kiert.backend: DEBUG
      org.springframework.boot.autoconfigure: INFO

---
# ============================================================
# PERFIL: dev (H2 - solo para pruebas)
# ============================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:kiert;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console