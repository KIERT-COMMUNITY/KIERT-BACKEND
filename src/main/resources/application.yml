spring:
  application:
    name: kiert-backend

  profiles:
    active: mysql

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 60MB

  # ========== REDIS CONFIGURATION ==========
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ========== CACHE CONFIGURATION ==========
  cache:
    type: redis
    redis:
      time-to-live: 1800000  # 30 minutos
      cache-null-values: false

  # ========== MAIL CONFIGURATION ==========
