# ==========================================================================
# Configuración por defecto: usa MySQL directamente
# ==========================================================================
spring:
  application:
    name: kiert-backend

  profiles:
    active: mysql

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 60MB

  # ===== CONFIGURACIÓN DE REDIS =====
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 1800000
      cache-null-values: false

  # ===== CONFIGURACIÓN DE CORREO (GMAIL) =====
  mail:
    host: smtp.gmail.com
    port: 587
    username: correo # ← REEMPLAZA CON TU GMAIL
    password: secret       # ← REEMPLAZA CON CONTRASEÑA DE APLICACIÓN
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  error:
    include-message: always

# ===== CONFIGURACIÓN DE SWAGGER =====
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    disable-swagger-default-url: true
    use-root-path: false
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  packages-to-scan: com.kiert.backend.controller
  paths-to-match: /api/**

# --------------------------------------------------------------------------
# Configuración propia de la app
# --------------------------------------------------------------------------
kiert:
  jwt:
    secret: "822c8ca2103ae9acfbefc5e0516dcab029e22c283801dc985c11f74c669656ef"
    expiration-ms: 86400000
  cors:
    allowed-origins: "http://localhost:4200"
  frontend:
    reset-password-url: "http://localhost:4200/restablecer-contrasena"

  cloudinary:
    cloud-name: "name"
    api-key: "key"
    api-secret: "key secret"

  supabase:
    url: "name"
    bucket: "kiert-files"
    service-role-key: "name"

---
# ============================================================
# PERFIL: mysql
# ============================================================
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: jdbc:mysql://localhost:3306/kiert_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: contraseña
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
      show-sql: true
      format-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: never

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
      com.kiert.backend: DEBUG
      org.springframework.boot.autoconfigure: INFO

---
# ============================================================
# PERFIL: dev (H2 - solo para pruebas)
# ============================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:kiert;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console

  redis:
    host: localhost
    port: 6379