spring:
  application:
    name: kiert-backend

  profiles:
    active: mysql

  config:
    import: vault://

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 60MB

  # ========== REDIS CONFIGURATION ==========
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ========== CACHE CONFIGURATION ==========
  cache:
    type: redis
    redis:
      time-to-live: 1800000  # 30 minutos
      cache-null-values: false
      key-prefix: "kiert:"

  # ========== MAIL CONFIGURATION ==========
  mail:
    host: ${vault.mail.host:smtp.gmail.com}
    port: ${vault.mail.port:587}
    username: ${vault.mail.username:gringoelmatador30@gmail.com}
    password: ${vault.mail.password:qxii xkra gsbf jszj}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  error:
    include-message: always

# ========== SWAGGER/OPENAPI ==========
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    disable-swagger-default-url: true
    use-root-path: false
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  packages-to-scan: com.kiert.backend.controller
  paths-to-match: /api/**

# ========== JWT CONFIGURATION ==========
kiert:
  jwt:
    secret: ${vault.jwt.secret:TBOqs9hbL57mK002kBHg6rfQXIFDFvRyEsm3ISAAl70=}
    expiration-ms: ${vault.jwt.expiration-ms:86400000}  # 24 horas
  cors:
    allowed-origins:
      - "http://localhost:4200"
      - "http://localhost:53334"
      - "*"
  frontend:
    reset-password-url: "http://localhost:4200/restablecer-contrasena"

  # ========== CLOUDINARY CONFIGURATION ==========
  cloudinary:
    cloud-name: ${vault.cloudinary.cloud-name:zopnporu}
    api-key: ${vault.cloudinary.api-key:271319861416221}
    api-secret: ${vault.cloudinary.api-secret:CyeOaPpO-eABboZou_R35PEKYs0}

logging:
  level:
    org.springframework.vault: DEBUG
    org.springframework.cloud.vault: DEBUG
    com.kiert.backend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

---
# ========== PERFIL: mysql ==========
spring:
  config:
    activate:
      on-profile: mysql
    import: vault://

  # ========== DATASOURCE MYSQL ==========
  datasource:
    url: ${vault.db.url:jdbc:mysql://localhost:3306/kiert_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${vault.db.username:root}
    password: ${vault.db.password:adrian.200503}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ========== JPA ==========
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
      show-sql: true
      format-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: never