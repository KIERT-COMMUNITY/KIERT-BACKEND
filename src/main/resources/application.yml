# ==========================================================================
# Configuración por defecto: perfil "dev" con H2 en memoria, para poder
# levantar el backend YA sin instalar MySQL. Cuando tengas MySQL listo,
# corre con --spring.profiles.active=mysql (ver application-mysql.yml).
# ==========================================================================
spring:
  application:
    name: kiert-backend

  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 60MB

server:
  port: 8080
  error:
    include-message: always

# --------------------------------------------------------------------------
# Configuración propia de la app (se lee desde @ConfigurationProperties)
# --------------------------------------------------------------------------
kiert:
  jwt:
    # ¡Cambia esta clave en producción! Debe tener al menos 32 caracteres.
    secret: "cambia-esta-clave-super-secreta-de-al-menos-32-caracteres-kiert"
    expiration-ms: 86400000 # 24 horas
  cors:
    allowed-origins: "http://localhost:4200"
  frontend:
    reset-password-url: "http://localhost:4200/restablecer-contrasena"
  supabase:
    url: "https://TU-PROYECTO.supabase.co"
    bucket: "kiert-files"
    service-role-key: "TU_SERVICE_ROLE_KEY" # se usa solo en el backend, NUNCA en el frontend

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:kiert;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # ============================================================
  # CONFIGURACIÓN DE CORREO PARA DESARROLLO (MAILTRAP)
  # ============================================================
  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: TU_USUARIO_MAILTRAP    # <--- CAMBIA ESTO
    password: TU_PASSWORD_MAILTRAP   # <--- CAMBIA ESTO
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    # Permite que data.sql se ejecute DESPUÉS de que Hibernate cree las tablas
    # (si no, Spring intenta correr el script antes de que existan)
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: jdbc:mysql://localhost:3306/kiert?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: adrian.200503
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============================================================
  # CONFIGURACIÓN DE CORREO PARA PRODUCCIÓN
  # ============================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: adriandelaguila.2005@gmail.com   # <--- CAMBIA ESTO
    password:    # <--- CAMBIA ESTO (Contraseña de aplicación)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false