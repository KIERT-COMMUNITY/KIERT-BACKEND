spring:
  application:
    name: kiert-backend

  # ✅ Vault desactivado
  cloud:
    vault:
      enabled: false
      fail-fast: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  # ✅ ACELERA ARRANQUE: no inicializa beans hasta que se usan
  main:
    lazy-initialization: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 60MB

  # ========== REDIS ==========
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 5000ms
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ========== CACHE ==========
  cache:
    type: redis
    redis:
      time-to-live: 1800000
      cache-null-values: false

  # ========== MAIL ==========
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  address: 0.0.0.0
  port: ${PORT:8081}
  error:
    include-message: always
  forward-headers-strategy: framework
  compression:
    enabled: true

# ========== SWAGGER ==========
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    disable-swagger-default-url: true
    use-root-path: false
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  packages-to-scan: com.kiert.backend.controller
  paths-to-match: /api/**

# ========== JWT ==========
kiert:
  jwt:
    secret: ${KIERT_JWT_SECRET:5ea8bc5772b55186e648930d752def86b48d09657d8e5d52f04d3b76bc5e2f9a}
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - ${KIERT_FRONTEND_URL:https://kiert-community.vercel.app}
      - "http://localhost:4200"
      - "http://localhost:53334"
  frontend:
    reset-password-url: ${KIERT_FRONTEND_RESET_URL:https://kiert-community.vercel.app/restablecer-contrasena}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  level:
    com.kiert.backend: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO
    org.hibernate: WARN

---
# ========== PERFIL: mysql (Producción) ==========
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000
      initialization-fail-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    # ✅ QUITADO: database-platform (Hibernate lo detecta solo)
    open-in-view: false
    hibernate:
      ddl-auto: none          # ✅ Las tablas ya existen en Aiven
      show-sql: false
      format-sql: false
    properties:
      hibernate:
        # ✅ QUITADO: dialect redundante
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: false
        hbm2ddl:
          auto: none

  sql:
    init:
      mode: never