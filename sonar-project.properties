# ============================================
# Configuración de SonarQube para KIERT-BACKEND
# ============================================

# Identificación del proyecto
sonar.projectKey=kiert-backend
sonar.projectName=KIERT-BACKEND
sonar.projectVersion=1.0.0

# Código fuente
sonar.sources=src/main/java
sonar.tests=src/test/java

# Codificación
sonar.sourceEncoding=UTF-8

# Binarios compilados (obligatorio para Java)
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Exclusiones (archivos que no se analizan)
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/*.min.js,\
  **/generated/**,\
  **/dto/**,\
  **/config/**,\
  **/*Application.java

# Exclusiones de tests
sonar.test.exclusions=\
  **/target/**,\
  **/*ApplicationTests.java

# Cobertura de tests (requiere JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Reglas de calidad
sonar.qualitygate.wait=true